# Put this file in your fork at:  .github/workflows/build-launcher.yml
# Run it from the Actions tab ("Build launcher" -> Run workflow), then download the
# "tv-launcher-apk" artifact from the finished run. It only BUILDS the APK
# (launcher/build-and-install.sh --build); it never touches a TV.
name: Build launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK pieces (build-tools 34, platform 34)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build APK only
        run: bash launcher/build-and-install.sh --build

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: launcher/build/tvhome.apk
          if-no-files-found: error
